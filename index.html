<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venice Chatbot</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#111; color:#eee; height:100vh; display:flex; justify-content:center; }
  .chat { width:100%; max-width:640px; height:100vh; display:flex; flex-direction:column; }
  .messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; line-height:1.4; }
  .msg.user { align-self:flex-end; background:#2d6cdf; color:#fff; }
  .msg.bot  { align-self:flex-start; background:#262626; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid #333; }
  input { flex:1; padding:12px 14px; border-radius:24px; border:1px solid #444; background:#1a1a1a; color:#eee; font-size:15px; outline:none; }
  button { padding:12px 20px; border-radius:24px; border:none; background:#2d6cdf; color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<div class="chat">
  <div class="messages" id="messages"></div>
  <form id="form">
    <input id="input" placeholder="Type a message..." autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </form>
</div>
<script>
const BACKEND_URL = 'PASTE_YOUR_RENDER_URL_HERE';

const messagesEl = document.getElementById('messages');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const history = [];

function addBubble(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addBubble('user', text);
  history.push({ role: 'user', content: text });
  input.value = '';
  input.disabled = true;
  sendBtn.disabled = true;

  const botBubble = addBubble('bot', '…');
  let full = '';

  try {
    const res = await fetch(BACKEND_URL + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const raw of lines) {
        const line = raw.trim();
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content || '';
          if (delta) {
            full += delta;
            botBubble.textContent = full;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        } catch {}
      }
    }
    history.push({ role: 'assistant', content: full });
  } catch (err) {
    botBubble.textContent = '⚠️ ' + err.message;
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
